<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Garante que o site fique responsivo no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital - 8º Ano</title>
  <!-- Link para o arquivo de estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Cabeçalho do Boletim -->
    <header class="header">
      <h1>Boletim Digital</h1>
      <p class="subtitle">8º Ano — Estudante Exemplo</p>
    </header>

    <!-- Cards de Resumo no topo -->
    <section class="cards-grid">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="media-geral" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="total-faltas" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="qtd-bom-desempenho" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Precisam de Atenção</h3>
        <p id="qtd-atencao" class="card-valor">—</p>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="frequencia" class="card-valor">92%</p>
        <span class="frequencia-status">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de Notas e Faltas -->
    <section class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <!-- O corpo da tabela será preenchido automaticamente pelo JavaScript -->
        <tbody id="corpo-tabela">
        </tbody>
      </table>
    </section>
  </div>

  <!-- Link para o arquivo de script JavaScript -->
  <script src="script.js"></script>
</body>
</html>
